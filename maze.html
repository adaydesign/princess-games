<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Princess Maze — เขาวงกตเจ้าหญิง</title>
<style>
:root{
  --ink:#342347;
  --primary:#854bc7;
  --paper:#fff9ff;
  --line:#e5d5ed;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;overscroll-behavior:none;
}
body{
  font-family:Tahoma,system-ui,sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 20% 0%,#ffe8f5,#e8e8ff 70%);
}
button,select{font:inherit}
button,select{
  border:1px solid var(--line);
  border-radius:12px;
  background:white;color:var(--ink);
  min-height:36px;padding:7px 10px;
}
button{
  cursor:pointer;
  box-shadow:0 3px 0 #dac9e6;
  touch-action:manipulation;
}
button:hover{filter:brightness(.97)}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible,select:focus-visible,a:focus-visible{
  outline:3px solid #ffb92e;outline-offset:2px;
}
button.primary{
  background:linear-gradient(135deg,#9259d5,#d34e9c);
  color:white;border-color:transparent;
}
button:disabled{opacity:.55;cursor:default}
.back-link{
  display:inline-flex;align-items:center;gap:4px;
  border:1px solid var(--line);border-radius:12px;
  background:white;color:var(--ink);
  min-height:36px;padding:7px 10px;
  text-decoration:none;font-weight:bold;font-size:12px;
  box-shadow:0 3px 0 #dac9e6;
}
.back-link:hover{filter:brightness(.97)}
.back-link:active{transform:translateY(2px);box-shadow:none}
[hidden]{display:none!important}
.app{
  height:100vh;height:100dvh;
  max-width:1250px;margin:auto;
  display:flex;flex-direction:column;gap:7px;
  padding:8px;
  padding-bottom:max(8px,env(safe-area-inset-bottom));
}
header{
  display:flex;align-items:center;
  justify-content:space-between;gap:8px;flex-shrink:0;flex-wrap:wrap;
}
h1{font-size:clamp(16px,2.3vw,25px);margin:0}
.audio{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.audio button{font-size:12px}
.toolbar{
  display:grid;grid-template-columns:1fr 1.2fr 1fr 1fr;
  gap:6px;flex-shrink:0;
}
.toolbar label{
  display:flex;align-items:center;gap:5px;
  font-size:12px;font-weight:bold;
}
.toolbar select{width:100%;min-width:0}
.toolbar button{font-size:12px}
.stats{
  display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;
  gap:6px;flex-shrink:0;
}
.stat{
  background:#ffffffd9;border:1px solid white;
  border-radius:12px;padding:6px 8px;
  text-align:center;font-size:12px;
}
.stat strong{font-size:15px}
#hp{color:#cf387a;letter-spacing:1px}
#clock.urgent{color:#d1214a;animation:pulse .65s infinite alternate}
.stage{
  min-height:0;flex:1;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  border-radius:18px;
  background:#ffffff60;
  border:1px solid #ffffffb0;
  overflow:hidden;
}
.board{
  position:relative;flex-shrink:0;
  overflow-x:auto;overflow-y:hidden;
  overscroll-behavior:contain;
  scrollbar-width:none;
  border-radius:12px;
  box-shadow:0 5px 20px #43345b28;
  touch-action:pan-x;
}
.board::-webkit-scrollbar{display:none}
#world{
  display:block;height:100%;
  max-width:none;user-select:none;
}
#world text{font-family:Tahoma,system-ui,sans-serif}
.foot{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-shrink:0;
}
.hints{
  font-size:11px;line-height:1.55;
  flex:1;min-width:0;
}
#toast{font-weight:bold;color:#8541a2;min-height:18px}
#sceneLabel{color:#716179}
.pad{
  width:138px;flex-shrink:0;
  display:grid;grid-template-columns:repeat(3,42px);
  grid-template-rows:repeat(2,35px);gap:4px;
}
.pad button{padding:0;min-height:0;font-size:20px}
.pad [data-dir="up"]{grid-column:2}
.pad [data-dir="left"]{grid-column:1;grid-row:2}
.pad [data-dir="down"]{grid-column:2;grid-row:2}
.pad [data-dir="right"]{grid-column:3;grid-row:2}
.overlay{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  padding:16px;background:#29173878;
  backdrop-filter:blur(5px);
}
.card{
  width:min(520px,100%);max-height:92dvh;
  overflow:auto;padding:23px;
  border-radius:25px;border:3px solid white;
  background:linear-gradient(145deg,#fffaff,#f3edff);
  box-shadow:0 20px 80px #28133155;
  text-align:center;
}
.card h2{margin:8px 0 12px;font-size:25px}
.card p{line-height:1.65;margin:10px 0}
.card .big{font-size:45px}
.card .actions{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  margin-top:18px;
}
.summary{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin:15px 0;text-align:left;
}
.summary div{background:white;border-radius:12px;padding:10px}
.small{font-size:12px;color:#76667d}
.shake{animation:shake .28s}
@keyframes shake{
  20%{transform:translateX(-5px)}
  40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}
@keyframes pulse{to{opacity:.45}}
@media(max-width:600px){
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar label{font-size:11px}
  .stats{gap:4px}
  .stat{padding:5px 3px;font-size:10px}
  .stat strong{font-size:13px}
  .audio button,.back-link{padding:6px;font-size:10px}
  .hints{font-size:10px}
  .card{padding:17px}
}
@media(max-height:520px){
  .app{gap:4px;padding:4px}
  header h1{font-size:16px}
  .toolbar{grid-template-columns:1fr 1.2fr 1fr 1fr}
  button,select,.back-link{min-height:29px;padding:4px 6px}
  .stat{padding:3px}
  .pad{grid-template-rows:repeat(2,27px);width:114px;
       grid-template-columns:repeat(3,34px)}
  .hints{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<main class="app">
  <header>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <a class="back-link" href="index.html">← กลับหน้ารวมเกม</a>
      <h1>👑 เขาวงกตเจ้าหญิง</h1>
    </div>
    <div class="audio">
      <button id="soundButton" aria-pressed="true">เสียง: เปิด</button>
      <button id="voiceButton" aria-pressed="true">เสียงพูด: เปิด</button>
      <button id="helpButton" aria-label="วิธีเล่น">?</button>
    </div>
  </header>

  <section class="toolbar" aria-label="ตั้งค่าเกม">
    <label>ระดับ
      <select id="level">
        <option value="1">1 · ง่าย</option>
        <option value="2">2 · ปานกลาง</option>
        <option value="3">3 · ยาก</option>
      </select>
    </label>
    <label>เจ้าหญิง
      <select id="princess"></select>
    </label>
    <button id="sameTheme">สุ่มผังธีมเดิม</button>
    <button id="newGame" class="primary">สุ่มด่านใหม่</button>
  </section>

  <section class="stats" aria-label="สถานะเกม">
    <div class="stat">ระดับ <strong id="levelLabel">1</strong></div>
    <div class="stat">เวลา <strong id="clock">00:00</strong></div>
    <div class="stat">พลัง <strong id="hp">ไม่จำกัด</strong></div>
    <div class="stat">ก้าว <strong id="steps">0</strong></div>
  </section>

  <section class="stage" id="stage">
    <div class="board" id="board" tabindex="0"
         role="region" aria-label="เขาวงกต ใช้ปุ่มลูกศรเดิน">
      <svg id="world" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="แผนที่เขาวงกต">
      </svg>
    </div>
  </section>

  <footer class="foot">
    <div class="hints">
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="sceneLabel"></div>
      <div id="hintText">ลูกศร / WASD · เดินทีละช่อง · ไปยังประตูดาว</div>
    </div>
    <div class="pad" aria-label="ปุ่มควบคุม">
      <button data-dir="up" aria-label="ขึ้น">▲</button>
      <button data-dir="left" aria-label="ซ้าย">◀</button>
      <button data-dir="down" aria-label="ลง">▼</button>
      <button data-dir="right" aria-label="ขวา">▶</button>
    </div>
  </footer>
</main>

<div id="overlay" class="overlay" role="dialog"
     aria-modal="true" aria-labelledby="dialogTitle">
  <div class="card" id="dialog"></div>
</div>

<script>
"use strict";

/* =========================================================
   64 รูปแบบ:
   เจ้าหญิง 12 + ฉาก 10 + ผนัง 12 + ประตู 8
   + ศัตรู 8 + อุปสรรค 8 + ยา 6
   ทุกภาพเป็น SVG ในไฟล์ ไม่โหลดไฟล์หรือไลบรารีภายนอก
   ========================================================= */

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const CELL = 48;
const LIMIT = 240000;
const DIR = {
  up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]
};
const reducedMotion =
  matchMedia("(prefers-reduced-motion: reduce)").matches;

const PRINCESSES = [

  {name:"อันนา",dress:"#7342a5",hair:"#a44c29",skin:"#ffe1cc",style:1},

  {name:"เบลล์",dress:"#ffd150",hair:"#744624",skin:"#ffe0bc",style:3},
  {name:"ซินเดอเรลล่า",dress:"#7aaef4",hair:"#f3cc69",skin:"#ffe2ca",style:4},
  {name:"สโนว์ไวท์",dress:"#ffce40",hair:"#292039",skin:"#ffe4d8",style:5},
  {name:"ออโรร่า",dress:"#f07dbd",hair:"#f8d772",skin:"#ffe1cd",style:6},
  {name:"ราพันเซล",dress:"#bc7ee0",hair:"#f8d65d",skin:"#ffdfc3",style:7},
  {name:"จัสมิน",dress:"#41cbbd",hair:"#262039",skin:"#cb915f",style:8},
  {name:"เทียน่า",dress:"#a9cd5f",hair:"#30202c",skin:"#995e3c",style:9},
  {name:"เมอริด้า",dress:"#397e77",hair:"#dc672f",skin:"#ffdcc3",style:10},
  {name:"โมอาน่า",dress:"#ec8366",hair:"#342326",skin:"#bb7e52",style:11}
];

const THEMES = [
  {name:"ปราสาทน้ำแข็ง",floor:"#e7f8ff",wall:"#83b8dd",edge:"#487caa",accent:"#52aee0",motif:"❄"},
  {name:"สวนกุหลาบ",floor:"#fff0f3",wall:"#bd739d",edge:"#814568",accent:"#e46499",motif:"✿"},
  {name:"อาณาจักรใต้ทะเล",floor:"#dcfbf5",wall:"#54b9ba",edge:"#277a8b",accent:"#dd87c9",motif:"○"},
  {name:"ห้องสมุดทองคำ",floor:"#fff4db",wall:"#c69b5d",edge:"#855734",accent:"#dfb249",motif:"✦"},
  {name:"วังแสงจันทร์",floor:"#eeeaff",wall:"#9994d5",edge:"#625b9d",accent:"#b6a0f4",motif:"☾"},
  {name:"ป่าแอปเปิล",floor:"#ecf7df",wall:"#83a96a",edge:"#526f42",accent:"#e57477",motif:"●"},
  {name:"หอคอยดอกไม้",floor:"#f6eaff",wall:"#b391d4",edge:"#795899",accent:"#d897e8",motif:"✿"},
  {name:"วังทะเลทราย",floor:"#fff0d6",wall:"#d4a174",edge:"#96613f",accent:"#4cbabd",motif:"◇"},
  {name:"สวนบัว",floor:"#e7f5df",wall:"#7fba91",edge:"#4c8468",accent:"#e995bd",motif:"✧"},
  {name:"เกาะสายรุ้ง",floor:"#e5fbef",wall:"#89b9a7",edge:"#537f7c",accent:"#eeaf6c",motif:"~"}
];

const WALL_NAMES = [
  "อิฐปราสาท","ผลึกน้ำแข็ง","พุ่มกุหลาบ","เปลือกหอย",
  "ชั้นหนังสือ","หินอ่อน","เถาวัลย์","หมอนเมฆ",
  "กระเบื้องเพชร","ดอกบัว","ปะการัง","โมเสกดาว"
];
const EXIT_NAMES = [
  "ซุ้มดาว","ปราสาทปลายทาง","ประตูสายรุ้ง","ประตูเปลือกหอย",
  "ซุ้มโคมไฟ","ต้นไม้แสง","ประตูคริสตัล","ประตูเมฆ"
];
const ENEMY_NAMES = [
  "ภูตขี้เล่น","ค้างคาวจิ๋ว","สไลม์องุ่น","แมงมุมปุย",
  "อีกาน้อย","เห็ดเดินได้","เมฆฝน","ก้อนหินมีชีวิต"
];
const HAZARD_NAMES = [
  "หลุมเวทมนตร์","เปลวไฟ","หนามยืดหด","เถาวัลย์หนาม",
  "วงเวทหมุน","น้ำแข็งเย็นจัด","ฟองเวทมนตร์","ประกายสายฟ้า"
];
const POTION_NAMES = [
  "ขวดยาหัวใจ","น้ำค้างดอกไม้","แก้วพลังดาว",
  "ไข่มุกฟื้นพลัง","ผลไม้หัวใจ","น้ำยาใบไม้"
];

PRINCESSES.forEach((p,i)=>{
  const option=document.createElement("option");
  option.value=i;option.textContent=p.name;
  $("princess").appendChild(option);
});

let game=null, config=null, staticLayer=null, actorLayer=null, fxLayer=null;
let particles=[], lastFrame=0, lastDraw=0, nextMoveAt=0;
let cameraCell=0, toastUntil=0;
let soundEnabled=true, voiceEnabled=true, audioContext=null;
let dialogReturnFocus=null;

function freshSeed(){
  if(window.crypto && crypto.getRandomValues){
    return crypto.getRandomValues(new Uint32Array(1))[0];
  }
  return (Date.now() ^ Math.floor(Math.random()*0xffffffff))>>>0;
}
function rngFrom(seed){
  let a=seed>>>0;
  return function(){
    a+=0x6D2B79F5;
    let t=a;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function integer(rng,a,b){return a+Math.floor(rng()*(b-a+1))}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)]}
function shuffle(rng,arr){
  for(let i=arr.length-1;i>0;i--){
    const j=integer(rng,0,i);
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function key(x,y){return x+","+y}
function same(a,b){return a.x===b.x && a.y===b.y}
function copy(p){return {x:p.x,y:p.y}}
function formatTime(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+
    String(s%60).padStart(2,"0");
}
function pathCell(x,y){
  return !!game && x>=0 && y>=0 && x<game.cols && y<game.rows &&
    game.grid[y][x]===0;
}
function neighbors(grid,p){
  const out=[];
  for(const [dx,dy] of Object.values(DIR)){
    const x=p.x+dx,y=p.y+dy;
    if(y>=0 && y<grid.length && x>=0 && x<grid[0].length &&
       grid[y][x]===0) out.push({x,y});
  }
  return out;
}
function routeBetween(grid,start,exit){
  const queue=[copy(start)],prev=new Map([[key(start.x,start.y),null]]);
  for(let i=0;i<queue.length;i++){
    const p=queue[i];
    if(same(p,exit))break;
    for(const n of neighbors(grid,p)){
      const k=key(n.x,n.y);
      if(!prev.has(k)){prev.set(k,p);queue.push(n)}
    }
  }
  const result=[];
  let p=copy(exit);
  while(p){result.push(p);p=prev.get(key(p.x,p.y))}
  return result.reverse();
}

/* ---------- เสียงสังเคราะห์ ---------- */

function unlockAudio(){
  if(!soundEnabled)return;
  try{
    const AudioClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioClass)return;
    if(!audioContext)audioContext=new AudioClass();
    if(audioContext.state==="suspended")audioContext.resume().catch(()=>{});
  }catch(e){}
}
function tone(freq,start,duration,type="sine",volume=.07){
  if(!soundEnabled || !audioContext || audioContext.state==="closed")return;
  try{
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    const t=audioContext.currentTime+start;
    osc.type=type;osc.frequency.setValueAtTime(freq,t);
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(volume,t+.012);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    osc.connect(gain);gain.connect(audioContext.destination);
    osc.start(t);osc.stop(t+duration+.025);
  }catch(e){}
}
function sfx(kind){
  if(kind==="step")tone(380,0,.055,"sine",.025);
  if(kind==="wall")tone(150,0,.055,"triangle",.025);
  if(kind==="hit"){
    tone(180,0,.16,"sawtooth",.055);
    tone(110,.08,.22,"triangle",.055);
  }
  if(kind==="potion"){
    [523,659,784].forEach((f,i)=>tone(f,i*.085,.18,"sine",.07));
  }
  if(kind==="start"){
    [392,523,659].forEach((f,i)=>tone(f,i*.10,.20,"triangle",.06));
  }
  if(kind==="win"){
    [523,659,784,1047,784,1047].forEach((f,i)=>
      tone(f,i*.14,.30,"triangle",.075));
  }
  if(kind==="lose"){
    [392,330,262,196].forEach((f,i)=>tone(f,i*.18,.32,"sine",.065));
  }
  if(kind==="tick")tone(760,0,.07,"sine",.03);
}
function speak(text){
  if(!voiceEnabled || !("speechSynthesis" in window))return;
  try{
    speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang="th-TH";
    utterance.rate=.92;
    utterance.pitch=1.14;
    const thaiVoice=speechSynthesis.getVoices().find(v=>v.lang.startsWith("th"));
    if(thaiVoice)utterance.voice=thaiVoice;
    speechSynthesis.speak(utterance);
  }catch(e){}
}

/* ---------- SVG: ตัวละครและอุปกรณ์ ---------- */

function star(cx,cy,r,color){
  const pts=[];
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5;
    const rr=i%2?r*.45:r;
    pts.push((cx+Math.cos(a)*rr)+","+(cy+Math.sin(a)*rr));
  }
  return `<polygon points="${pts.join(" ")}" fill="${color}"/>`;
}
function princessSVG(index){
  const p=PRINCESSES[index],s=p.style;
  const hairBack=[
    `<path d="M15 15Q10 24 17 34L22 31L20 16Z" fill="${p.hair}"/>`,
    `<path d="M15 16L11 34L16 36L21 17M29 17L32 36L37 33L32 15" fill="${p.hair}"/>`,
    `<path d="M12 15Q4 30 13 39Q22 41 26 34L34 37Q43 24 33 13Z" fill="${p.hair}"/>`,
    `<circle cx="24" cy="11" r="8" fill="${p.hair}"/>`,
    `<circle cx="24" cy="8" r="7" fill="${p.hair}"/>`,
    `<path d="M12 15Q7 30 15 30H34Q40 23 34 13Z" fill="${p.hair}"/>`,
    `<path d="M13 15L10 35L19 39L24 27L32 39L39 34L34 14Z" fill="${p.hair}"/>`,
    `<path d="M17 16Q7 27 13 38Q24 49 37 39L31 34Q19 40 21 17Z" fill="${p.hair}"/>`,
    `<path d="M16 17Q10 27 24 38Q36 31 32 17Z" fill="${p.hair}"/>`,
    `<circle cx="24" cy="8" r="7" fill="${p.hair}"/>`,
    `<g fill="${p.hair}">
       <circle cx="13" cy="17" r="7"/><circle cx="35" cy="17" r="7"/>
       <circle cx="12" cy="27" r="7"/><circle cx="36" cy="27" r="7"/>
       <circle cx="16" cy="34" r="6"/><circle cx="32" cy="34" r="6"/>
     </g>`,
    `<path d="M13 14Q5 26 11 38L19 36L24 29L31 37L39 35Q42 23 33 13Z" fill="${p.hair}"/>`

/* ---------- สร้างเขาวงกต ---------- */

function makeMaze(cols,rows,rng){
  const grid=Array.from({length:rows},()=>Array(cols).fill(1));
  const stack=[{x:1,y:1}];
  grid[1][1]=0;
  while(stack.length){
    const p=stack[stack.length-1];
    const options=[];
    for(const [dx,dy] of [[2,0],[-2,0],[0,2],[0,-2]]){
      const x=p.x+dx,y=p.y+dy;
      if(x>0&&x<cols-1&&y>0&&y<rows-1&&grid[y][x]===1){
        options.push({x,y,dx,dy});
      }
    }
    if(!options.length){stack.pop();continue}
    const n=pick(rng,options);
    grid[p.y+n.dy/2][p.x+n.dx/2]=0;
    grid[n.y][n.x]=0;
    stack.push({x:n.x,y:n.y});
  }

  // เปิดวงทางเลือกบางส่วน ลดทางตันที่ต้องรอนาน
  const candidates=[];
  for(let y=1;y<rows-1;y++){
    for(let x=1;x<cols-1;x++){
      if(grid[y][x]!==1)continue;
      const h=grid[y][x-1]===0&&grid[y][x+1]===0;
      const v=grid[y-1][x]===0&&grid[y+1][x]===0;
      if(h!==v)candidates.push({x,y});
    }
  }
  shuffle(rng,candidates);
  const holes=Math.floor(cols*rows*.025);
  candidates.slice(0,holes).forEach(p=>grid[p.y][p.x]=0);
  return grid;
}
function createGame(c){
  const rng=rngFrom(c.seed),level=c.level;
  const cols=level===3?c.baseCols*2-1:c.baseCols;
  const rows=c.rows;
  const grid=makeMaze(cols,rows,rng);
  const reverse=level===3 && rng()<.5;
  const start={
    x:reverse?cols-2:1,
    y:1+2*integer(rng,0,(rows-3)/2)
  };
  const exit={
    x:reverse?1:cols-2,
    y:1+2*integer(rng,0,(rows-3)/2)
  };
  const mainRoute=routeBetween(grid,start,exit);
  const protectedRoute=new Set(mainRoute.map(p=>key(p.x,p.y)));
  const cells=[];
  for(let y=1;y<rows-1;y++){
    for(let x=1;x<cols-1;x++){
      if(grid[y][x]===0)cells.push({x,y});
    }
  }

  const g={
    cols,rows,grid,start,exit,reverse,mainRoute,
    player:copy(start),previous:copy(start),
    level,theme:c.theme,wall:integer(rng,0,11),exitType:integer(rng,0,7),
    mode:"ready",hp:level===2?5:level===3?3:Infinity,
    maxHP:level===2?5:level===3?3:Infinity,
    steps:0,hits:0,collected:0,elapsed:0,
    startAt:0,deadline:0,lastTick:-1,
    enemyAt:0,invulnerableUntil:0,
    enemies:[],hazards:[],potions:[],
    enemyPeriod:level===3?590:760
  };
  if(level===1)return g;

  const forbidden=new Set();
  for(const p of cells){
    if(Math.abs(p.x-start.x)+Math.abs(p.y-start.y)<=3 ||
       Math.abs(p.x-exit.x)+Math.abs(p.y-exit.y)<=2){
      forbidden.add(key(p.x,p.y));
    }
  }
  const reserved=new Set(forbidden);

  // เส้นลาดตระเวนมีช่องนอกเส้นทางหลักเสมอ
  // และแตะเส้นทางหลักได้ไม่เกิน 1 ช่องต่อศัตรู
  // จึงรอให้ศัตรูเดินพ้น แล้วค่อยเดินผ่านได้
  const enemyCount=integer(rng,level===2?2:3,level===2?3:5);
  for(let i=0;i<enemyCount;i++){
    const roots=shuffle(rng,cells.filter(p=>
      !reserved.has(key(p.x,p.y))&&!protectedRoute.has(key(p.x,p.y))));
    let patrol=null;
    for(const root of roots){
      const route=[copy(root)];
      const seen=new Set([key(root.x,root.y)]);
      let mainCount=0;
      const length=integer(rng,3,6);
      while(route.length<length){
        const options=neighbors(grid,route[route.length-1]).filter(n=>{
          const k=key(n.x,n.y);
          return !reserved.has(k)&&!seen.has(k)&&
            (!protectedRoute.has(k)||mainCount===0);
        });
        if(!options.length)break;
        const n=pick(rng,options),k=key(n.x,n.y);
        if(protectedRoute.has(k))mainCount++;
        route.push(n);seen.add(k);
      }
      if(route.length>=2){patrol=route;break}
    }
    if(!patrol)return null; // ให้ระบบสร้าง seed ใหม่ถ้าพื้นที่ไม่พอ
    patrol.forEach(p=>reserved.add(key(p.x,p.y)));
    const idx=integer(rng,0,patrol.length-1);
    g.enemies.push({
      type:integer(rng,0,7),route:patrol,index:idx,
      dir:idx===patrol.length-1?-1:1,
      x:patrol[idx].x,y:patrol[idx].y
    });
  }

  // หลุมและเถาวัลย์ถาวรอยู่ข้างทาง ไม่ปิดเส้นทางออก
  const staticCandidates=shuffle(rng,cells.filter(p=>{
    const k=key(p.x,p.y);
    return !reserved.has(k)&&!protectedRoute.has(k);
  }));
  const fixedCount=level===2?3:6;
  staticCandidates.slice(0,fixedCount).forEach((p,i)=>{
    reserved.add(key(p.x,p.y));
    g.hazards.push({
      ...p,type:i%2?3:0,period:0,offset:0
    });
  });

  // อุปสรรคบนเส้นทางหลักเปิด-ปิด และไม่วางติดกัน
  const dynamicCandidates=shuffle(rng,cells.filter(p=>
    !reserved.has(key(p.x,p.y))));
  const dynamicTypes=shuffle(rng,[1,2,4,5,6,7]);
  const dynamicCount=level===2?6:11;
  let placed=0;
  for(const p of dynamicCandidates){
    if(placed>=dynamicCount)break;
    if(g.hazards.some(h=>Math.abs(h.x-p.x)+Math.abs(h.y-p.y)<3))continue;
    reserved.add(key(p.x,p.y));
    g.hazards.push({
      ...p,type:dynamicTypes[placed%dynamicTypes.length],
      period:integer(rng,3000,4200),offset:integer(rng,0,3000)
    });
    placed++;
  }

  const potionCandidates=shuffle(rng,cells.filter(p=>
    !reserved.has(key(p.x,p.y))));
  potionCandidates.slice(0,level===2?4:6).forEach((p,i)=>{
    g.potions.push({...p,type:(integer(rng,0,5)+i)%6,collected:false});
  });
  return g;
}
function hazardActive(h,elapsed=game.elapsed){
  if(h.period===0)return true;
  return ((elapsed+h.offset)%h.period)<h.period*.48;
}
function hazardAt(p,activeOnly=true){
  return game.hazards.find(h=>same(h,p)&&(!activeOnly||hazardActive(h)));
}
function enemyAt(p){
  return game.enemies.some(e=>same(e,p));
}
function safeCell(p){
  return pathCell(p.x,p.y)&&!enemyAt(p)&&!hazardAt(p);
}
function nearestSafe(origin){
  const queue=[copy(origin)],seen=new Set([key(origin.x,origin.y)]);
  for(let i=0;i<queue.length;i++){
    const p=queue[i];
    if(safeCell(p))return p;
    for(const n of neighbors(game.grid,p)){
      const k=key(n.x,n.y);
      if(!seen.has(k)){seen.add(k);queue.push(n)}
    }
  }
  return copy(game.start);
}

/* ---------- วาดฉาก ---------- */

function buildWorld(){
  const g=game,t=THEMES[g.theme];
  const width=g.cols*CELL,height=g.rows*CELL;
  $("world").setAttribute("viewBox",`0 0 ${width} ${height}`);
  $("world").style.width=g.level===3?"200%":"100%";

  let html=`
    <defs>
      <pattern id="wallPattern" width="48" height="48" patternUnits="userSpaceOnUse">
        ${wallPattern(g.wall,t)}
      </pattern>
      <pattern id="floorPattern" width="48" height="48" patternUnits="userSpaceOnUse">
        <rect width="48" height="48" fill="${t.floor}"/>
        <path d="M48 0H0V48" fill="none" stroke="${t.edge}" opacity=".09"/>
        <circle cx="8" cy="8" r="1.5" fill="${t.accent}" opacity=".16"/>
      </pattern>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2"/>
      </filter>
    </defs>
    <rect width="${width}" height="${height}" fill="url(#floorPattern)"/>
    <g id="staticLayer">`;

  for(let y=0;y<g.rows;y++){
    for(let x=0;x<g.cols;x++){
      if(g.grid[y][x]===1){
        html+=`<rect x="${x*CELL}" y="${y*CELL}" width="48" height="48"
          fill="url(#wallPattern)"/>`;
      }else if((x*7+y*11)%19===0){
        html+=`<text x="${x*CELL+24}" y="${y*CELL+29}" text-anchor="middle"
          font-size="19" fill="${t.accent}" opacity=".17">${t.motif}</text>`;
      }
    }
  }

  html+=`<g transform="translate(${g.start.x*CELL} ${g.start.y*CELL})">
      <rect x="4" y="4" width="40" height="40" rx="12"
        fill="#fff7" stroke="#a4c798" stroke-dasharray="4 3"/>
      <text x="24" y="31" text-anchor="middle" font-size="22" fill="#8bbb81">♡</text>
    </g>
    <g transform="translate(${g.exit.x*CELL} ${g.exit.y*CELL})">
      ${exitSVG(g.exitType,t.accent)}
    </g></g><g id="actorLayer"></g><g id="fxLayer"></g>`;

  $("world").innerHTML=html;
  staticLayer=$("staticLayer");
  actorLayer=$("actorLayer");
  fxLayer=$("fxLayer");
  $("sceneLabel").textContent=
    `${t.name} · ${WALL_NAMES[g.wall]} · ${EXIT_NAMES[g.exitType]}`;
  $("hintText").textContent=g.level===1?
    "ลูกศร / WASD · เดินทีละช่อง · ไปยังประตูดาว":
    `ลูกศร / WASD · จุดเขียว = ผ่านได้ · ยา +1${g.level===3?" · ปัดซ้าย–ขวาเพื่อดูแผนที่":""}`;
  fitBoard();
  renderActors(performance.now());
}
function fitBoard(){
  if(!game)return;
  const box=$("stage").getBoundingClientRect();
  const viewCols=game.level===3?game.cols/2:game.cols;
  cameraCell=Math.min(
    Math.max(1,box.width-8)/viewCols,
    Math.max(1,box.height-8)/game.rows
  );
  $("board").style.width=(viewCols*cameraCell)+"px";
  $("board").style.height=(game.rows*cameraCell)+"px";
  followPlayer(false);
}
function followPlayer(smooth=true){
  if(!game)return;
  const board=$("board");
  if(game.level!==3){board.scrollLeft=0;return}
  const target=(game.player.x+.5)*cameraCell-board.clientWidth/2;
  const max=board.scrollWidth-board.clientWidth;
  board.scrollTo({
    left:Math.max(0,Math.min(max,target)),
    top:0,behavior:smooth&&!reducedMotion?"smooth":"auto"
  });
}
function renderActors(now){
  if(!game||!actorLayer)return;
  const elapsed=game.elapsed/1000;
  let html="";
  for(const h of game.hazards){
    html+=`<g transform="translate(${h.x*CELL} ${h.y*CELL})">
      ${hazardSVG(h.type,hazardActive(h),reducedMotion?0:elapsed)}
    </g>`;
  }
  for(const p of game.potions){
    if(p.collected)continue;
    const bob=reducedMotion?0:Math.sin(elapsed*3+p.x)*2;
    html+=`<g transform="translate(${p.x*CELL} ${p.y*CELL+bob})">
      ${potionSVG(p.type)}</g>`;
  }
  for(const e of game.enemies){
    const bob=reducedMotion?0:Math.sin(elapsed*5+e.x)*1.3;
    html+=`<g transform="translate(${e.x*CELL} ${e.y*CELL+bob})">
      ${enemySVG(e.type)}</g>`;
  }
  const blink=game.mode==="playing"&&Date.now()<game.invulnerableUntil&&
    Math.floor(now/100)%2===0;
  const p=game.player;
  html+=`<g transform="translate(${p.x*CELL} ${p.y*CELL})"
      opacity="${blink?.42:1}">
    ${Date.now()<game.invulnerableUntil?
      '<circle cx="24" cy="24" r="22" fill="#ffd9ed55" stroke="#f1a6d5" stroke-width="2"/>':""}
    ${princessSVG(Number($("princess").value))}
  </g>`;
  actorLayer.innerHTML=html;
}
function burst(p,color,count=16,kind="spark"){
  if(reducedMotion)count=Math.min(count,6);
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=35+Math.random()*90;
    particles.push({
      x:(p.x+.5)*CELL,y:(p.y+.5)*CELL,
      vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-35,
      age:0,life:kind==="confetti"?1.8:.65,
      color:kind==="confetti"?
        pick(Math.random,["#ff9fcf","#a4dbff","#ffe48d","#b6e89a","#c7a5f3"]):color,
      size:3+Math.random()*4,kind
    });
  }
}
function renderParticles(dt){
  if(!fxLayer)return;
  let html="";
  particles=particles.filter(p=>p.age<p.life);
  for(const p of particles){
    p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;
    const opacity=Math.max(0,1-p.age/p.life);
    html+=p.kind==="confetti"?
      `<rect x="${p.x}" y="${p.y}" width="${p.size}" height="${p.size*1.5}"
        fill="${p.color}" opacity="${opacity}"
        transform="rotate(${p.age*180} ${p.x} ${p.y})"/>`:
      `<circle cx="${p.x}" cy="${p.y}" r="${p.size*opacity}"
        fill="${p.color}" opacity="${opacity}"/>`;
  }
  fxLayer.innerHTML=html;
}
function toast(text,duration=2600){
  $("toast").textContent=text;toastUntil=Date.now()+duration;
}
function updateHUD(){
  const g=game;
  $("levelLabel").textContent=["","ง่าย","ปานกลาง","ยาก"][g.level];
  $("steps").textContent=g.steps;
  $("hp").textContent=g.level===1?"ไม่จำกัด":
    "♥".repeat(g.hp)+"♡".repeat(g.maxHP-g.hp);
  $("hp").setAttribute("aria-label",
    g.level===1?"พลังไม่จำกัด":`พลังชีวิต ${g.hp} จาก ${g.maxHP}`);
  const remain=g.mode==="ready"?LIMIT:Math.max(0,LIMIT-g.elapsed);
  $("clock").textContent=g.level===1?formatTime(g.elapsed):
    formatTime(Math.ceil(remain/1000)*1000);
  $("clock").classList.toggle("urgent",g.level>1&&remain<=30000&&g.mode==="playing");
}

/* ---------- กติกาและการเคลื่อนที่ ---------- */

function refreshElapsed(){
  if(game.mode!=="playing")return;
  game.elapsed=Date.now()-game.startAt;
  if(game.level>1&&Date.now()>=game.deadline){
    game.elapsed=LIMIT;
    finish(false,"หมดเวลา 4 นาที");
  }
}
function hit(reason,returnCell,displace){
  if(game.mode!=="playing"||game.level===1)return;

  // ถูกศัตรูเดินเข้าหา หรือยืนบนกับดักที่เปิด:
  // กลับช่องก่อนหน้า ถ้าไม่ปลอดภัยให้หาช่องว่างที่ใกล้ที่สุด
  if(displace){
    game.player=safeCell(returnCell)?copy(returnCell):nearestSafe(returnCell);
    game.previous=copy(game.player);
    followPlayer();
  }

  // ช่วงป้องกันความเสียหายซ้ำ ไม่อนุญาตให้เดินทะลุอันตราย
  if(Date.now()<game.invulnerableUntil)return;
  game.hp--;game.hits++;
  game.invulnerableUntil=Date.now()+1100;
  sfx("hit");
  burst(game.player,"#f18ac1",22);
  const board=$("board");
  board.classList.remove("shake");
  void board.offsetWidth;
  board.classList.add("shake");
  setTimeout(()=>board.classList.remove("shake"),300);
  toast(`${reason} · พลัง -1 · กลับช่องก่อนหน้า`);
  updateHUD();
  if(game.hp<=0)finish(false,"พลังชีวิตหมด");
  else speak(`อุ๊ย! ระวัง${reason}นะจ๊ะ ลองเดินใหม่จ้ะ`);
}
function collectPotion(){
  const p=game.potions.find(p=>!p.collected&&same(p,game.player));
  if(!p)return;
  if(game.hp>=game.maxHP){
    toast("พลังเต็มแล้ว! ยาจะอยู่ที่เดิม เก็บภายหลังได้");
    return;
  }
  p.collected=true;
  game.hp=Math.min(game.maxHP,game.hp+1);
  game.collected++;
  sfx("potion");burst(p,"#a7df91",20);
  toast(`${POTION_NAMES[p.type]} · พลัง +1`);
  speak(`เย่! ได้รับ${POTION_NAMES[p.type]} เพิ่มพลังหัวใจหนึ่งดวงจ้ะ`);
  updateHUD();
}
function move(direction){
  if(!game||game.mode!=="playing")return;
  const now=performance.now();
  if(now<nextMoveAt)return;
  nextMoveAt=now+130;
  unlockAudio();
  refreshElapsed();
  if(game.mode!=="playing")return;
  const [dx,dy]=DIR[direction];
  const from=copy(game.player);
  const target={x:from.x+dx,y:from.y+dy};

  if(!pathCell(target.x,target.y)){sfx("wall");return}

  const enemy=game.enemies.find(e=>same(e,target));
  if(enemy){
    hit(`ชน${ENEMY_NAMES[enemy.type]}`,from,false);
    renderActors(performance.now());return;
  }
  const hazard=hazardAt(target);
  if(hazard){
    hit(`แตะ${HAZARD_NAMES[hazard.type]}`,from,false);
    renderActors(performance.now());return;
  }

  game.previous=from;
  game.player=target;
  game.steps++;
  sfx("step");
  collectPotion();
  followPlayer();
  updateHUD();
  renderActors(performance.now());
  if(same(target,game.exit))finish(true,"ถึงทางออกแล้ว");
}
function moveEnemies(){
  for(const e of game.enemies){
    let next=e.index+e.dir;
    if(next<0||next>=e.route.length){
      e.dir*=-1;next=e.index+e.dir;
    }
    const target=e.route[next];
    if(game.enemies.some(other=>other!==e&&same(other,target)))continue;
    e.index=next;e.x=target.x;e.y=target.y;
    if(same(e,game.player)){
      hit(`ชน${ENEMY_NAMES[e.type]}`,game.previous,true);
      if(game.mode!=="playing")return;
    }
  }
}
function updateGame(){
  if(!game||game.mode!=="playing")return;
  refreshElapsed();
  if(game.mode!=="playing")return;

  if(game.level>1){
    if(game.elapsed>=game.enemyAt){
      moveEnemies();
      game.enemyAt=game.elapsed+game.enemyPeriod;
    }
    if(game.mode!=="playing")return;
    const danger=hazardAt(game.player);
    if(danger)hit(`${HAZARD_NAMES[danger.type]}เปิดทำงาน`,game.previous,true);

    const seconds=Math.ceil((LIMIT-game.elapsed)/1000);
    if(seconds<=10&&seconds>0&&seconds!==game.lastTick){
      game.lastTick=seconds;sfx("tick");
    }
  }
  updateHUD();
}

function start(){

function finish(win,reason){

    return;
  }

function prepare(mode){
  if("speechSynthesis" in window)speechSynthesis.cancel();
  const level=Number($("level").value);
  let c;
  if(mode==="replay"&&config){
    c={...config};
    $("level").value=c.level;
  }else{
    const rect=$("stage").getBoundingClientRect();
    const portrait=rect.width<rect.height*1.1;
    const baseCols=portrait?13:19;
    const rows=portrait?17:11;
    c={
      seed:freshSeed(),level,baseCols,rows,
      theme:mode==="sameTheme"&&config?
        config.theme:Math.floor(Math.random()*THEMES.length)
    };
  }

  // สร้างใหม่ถ้าจัดศัตรูตามจำนวนที่ต้องการไม่ได้
  let made=null;
  for(let attempt=0;attempt<150;attempt++){
    made=createGame(c);
    if(made)break;
    c.seed=(c.seed+0x9E3779B9)>>>0;
  }
  if(!made){
    showDialog(`<h2 id="dialogTitle">ยังจัดด่านนี้ไม่สำเร็จ</h2>
      <p>กรุณาลองสุ่มด่านใหม่</p>
      <div class="actions"><button id="tryBuild">สุ่มใหม่</button></div>`);
    $("tryBuild").onclick=()=>prepare("new");
    return;
  }
  config={...c};
  game=made;particles=[];nextMoveAt=0;
  $("toast").textContent="พร้อมออกผจญภัย";
  toastUntil=0;
  buildWorld();
  updateHUD();
  readyDialog();
}

/* ---------- อินพุตและวงรอบหลัก ---------- */

const keyMap={
  ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
  w:"up",s:"down",a:"left",d:"right",
  W:"up",S:"down",A:"left",D:"right"
};
document.addEventListener("keydown",e=>{
  if(!$("overlay").hidden){
    // เก็บโฟกัสไว้ใน dialog
    if(e.key==="Tab"){
      const buttons=[...$("dialog").querySelectorAll("button:not(:disabled), a[href]")];
      if(!buttons.length)return;
      const first=buttons[0],last=buttons[buttons.length-1];
      if(e.shiftKey&&document.activeElement===first){
        e.preventDefault();last.focus();
      }else if(!e.shiftKey&&document.activeElement===last){
        e.preventDefault();first.focus();
      }
    }
    return;
  }
  if(e.target instanceof HTMLSelectElement)return;
  const direction=keyMap[e.key];
  if(direction){e.preventDefault();move(direction)}
});

document.querySelectorAll("[data-dir]").forEach(button=>{
  button.addEventListener("pointerdown",e=>{
    e.preventDefault();move(button.dataset.dir);
  });
  // ให้คีย์บอร์ดและโปรแกรมอ่านหน้าจอกดปุ่มได้ด้วย
  button.addEventListener("click",e=>{
    if(e.detail===0)move(button.dataset.dir);
  });
});
$("newGame").onclick=()=>prepare("new");
$("sameTheme").onclick=()=>prepare("sameTheme");
$("level").onchange=()=>prepare("sameTheme");
$("princess").onchange=()=>{
  renderActors(performance.now());
  const pName=PRINCESSES[Number($("princess").value)].name;
  toast(`เลือก${pName}แล้ว`);
  speak(`เลือกเจ้าหญิง${pName}จ้า`);
};
$("soundButton").onclick=()=>{
  soundEnabled=!soundEnabled;
  $("soundButton").textContent="เสียง: "+(soundEnabled?"เปิด":"ปิด");
  $("soundButton").setAttribute("aria-pressed",String(soundEnabled));
  if(soundEnabled){unlockAudio();sfx("potion")}
};
$("voiceButton").onclick=()=>{
  if(!("speechSynthesis" in window)){
    toast("เบราว์เซอร์นี้ไม่รองรับเสียงพูด");
    return;
  }
  voiceEnabled=!voiceEnabled;
  $("voiceButton").textContent="เสียงพูด: "+(voiceEnabled?"เปิด":"ปิด");
  $("voiceButton").setAttribute("aria-pressed",String(voiceEnabled));
  if(voiceEnabled)speak("เปิดเสียงพูดของเจ้าหญิงแล้วจ้ะ");
  else speechSynthesis.cancel();
};
$("helpButton").onclick=help;

if("speechSynthesis" in window){
  speechSynthesis.getVoices();
  speechSynthesis.addEventListener?.("voiceschanged",()=>speechSynthesis.getVoices());
}
window.addEventListener("pagehide",()=>{
  if("speechSynthesis" in window)speechSynthesis.cancel();
});

if("ResizeObserver" in window){
  new ResizeObserver(()=>fitBoard()).observe($("stage"));
}else{
  window.addEventListener("resize",fitBoard);
}

// เวลาเดินต่อแม้สลับแท็บ และตรวจวันเวลาจริงเมื่อกลับมา
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    updateGame();
    if(game&&game.mode==="playing")followPlayer(false);
  }
});
setInterval(updateGame,80);

function frame(now){
  const dt=Math.min(.05,(now-lastFrame)/1000||.016);
  lastFrame=now;
  if(now-lastDraw>33){
    renderActors(now);lastDraw=now;
  }
  renderParticles(dt);
  if(toastUntil&&Date.now()>toastUntil){
    $("toast").textContent=game&&game.mode==="playing"?
      "เป้าหมาย: ประตูที่มีดาว":"พร้อมออกผจญภัย";
    toastUntil=0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
requestAnimationFrame(()=>prepare("new"));
</script>
</body>
</html>
